[workspace]
members = ["media-domain", "media-orchestrator", "media-ffmpeg", "media-ffi", "media-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde_json = "=1.0.149"
media-domain = { path = "media-domain" }
media-orchestrator = { path = "media-orchestrator" }
media-ffmpeg = { path = "media-ffmpeg" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
